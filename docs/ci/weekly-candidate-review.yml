# INACTIVE REVIEW DRAFT. Owner approval is required before copying to .github/workflows/.
# No publication, tag, OIDC, secrets or external messages.
name: Weekly candidate review
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Already reviewed current main commit (full SHA)
        required: true
        type: string
# After the October 13 owner decision, Friday scheduling may be proposed separately.
permissions:
  contents: read
concurrency:
  group: weekly-candidate-review
  cancel-in-progress: false
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.reviewed_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Review revision before running its project code
        shell: bash
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$REVIEWED_SHA"
      - name: Full source tests and JS conformance
        shell: bash
        run: |
          python -m pip install build pytest tomli -r requirements-ui.txt
          python scripts/run_tests.py
          node js/showwork-audit/test.mjs
      - name: Build exact wheel and smoke a clean runtime environment
        shell: bash
        env:
          SOURCE_DATE_EPOCH: '315532800'
          PYTHONPATH: ''
        run: |
          python -m build --wheel --outdir "$RUNNER_TEMP/candidate-wheel"
          python -m venv "$RUNNER_TEMP/candidate-runtime"
          if [ "$RUNNER_OS" = Windows ]; then
            runtime="$RUNNER_TEMP/candidate-runtime/Scripts/python.exe"
          else
            runtime="$RUNNER_TEMP/candidate-runtime/bin/python"
          fi
          "$runtime" -m pip install --no-deps "$RUNNER_TEMP"/candidate-wheel/*.whl
          "$runtime" -O scripts/smoke_release.py
          python -c "import hashlib,os,pathlib; [print(p.name,hashlib.sha256(p.read_bytes()).hexdigest()) for p in (pathlib.Path(os.environ['RUNNER_TEMP'])/'candidate-wheel').glob('*.whl')]"
# The owner captures raw runs and hashes, executes the existing tracked receipt
# gate for the reviewed source session, and reviews compatibility/version/changelog.
# This draft does not authorize publication or claim matrix evidence before it runs.
