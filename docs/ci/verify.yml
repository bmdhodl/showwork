# Copy to .github/workflows/showwork.yml and make receipts a required check.
# The job executes repository tests only for trusted same-repository PRs.
name: showwork receipts
on:
  pull_request:
jobs:
  receipts:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: bmdhodl/showwork/actions/verify@0c1e52792a2eb5e7ae5dcc2b46f6bf7262850642 # merge-base selector and advisory mode
        with:
          changed-since: ${{ github.event.pull_request.base.sha }}
          allow-commands: "true"
          require-tracked: "true"
