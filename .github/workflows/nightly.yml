name: Nightly package compatibility

on:
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install this commit's wheel
        shell: bash
        run: |
          python -m pip install build pytest
          python -m build --wheel
          python -m pip install --no-deps dist/*.whl
      - name: Installed CLI accepts real outcomes and refuses false completion
        run: python scripts/smoke_release.py
      - name: Behavioral and conformance tests
        run: python scripts/run_tests.py
      - name: Record tested revision and runtime
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          python --version >> "$GITHUB_STEP_SUMMARY"
          python -m pip freeze >> "$GITHUB_STEP_SUMMARY"
