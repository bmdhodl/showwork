name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref. A superseded push should not hold a runner while the
# commit it tested is already history.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          clean: false

      - name: Reset workspace and keep the Python environment
        run: git clean -ffdx -e /.venv/

      - name: Install dependencies when inputs changed
        run: bash scripts/ci/ensure-python-dependencies.sh

      - name: Run behavioral and conformance tests
        run: .venv/bin/python scripts/run_tests.py

      - name: Verify the committed genesis receipt
        run: .venv/bin/showwork verify --session genesis --no-report

      - name: Verify the integrity chain
        run: .venv/bin/showwork verify

  conformance-js:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, pc]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Require host-provisioned Node.js 24
        shell: bash
        run: |
          node_version="$(node --version)"
          echo "Using ${node_version}"
          [[ "$node_version" == v24.* ]]

      - name: JS auditor must match the frozen chain fixtures
        run: node js/showwork-audit/test.mjs

  receipts:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Gate on the repo's own receipts (chain audit + phase-1 session)
        uses: ./actions/verify
        with:
          session: v02-phase-1
          # allow-commands stays false: this doubles as a live demonstration
          # of fork-safe mode - the suite's command claim reports the policy
          # error honestly and the gate tolerates YELLOW unless strict.
