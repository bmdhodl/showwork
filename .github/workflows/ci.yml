name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref. A superseded push should not hold a runner while the
# commit it tested is already history.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          clean: false

      - name: Reset workspace and keep the Python environment
        run: git clean -ffdx -e /.venv/

      - name: Install dependencies when inputs changed
        run: bash scripts/ci/ensure-python-dependencies.sh

      - name: Run behavioral and conformance tests
        run: .venv/bin/python scripts/run_tests.py

      - name: Install Chromium for receipt UI verification
        run: .venv/bin/python -m playwright install --with-deps chromium

      - name: Exercise receipt UI and responsive states
        run: .venv/bin/python scripts/check_receipts_ui.py

      - name: Verify the committed genesis receipt
        run: .venv/bin/showwork verify --session genesis --no-report

      - name: Verify the integrity chain
        run: .venv/bin/showwork verify

  conformance-js:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: JS auditor must match the frozen chain fixtures
        run: node js/showwork-audit/test.mjs

  receipts:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install acceptance test dependencies
        run: bash scripts/ci/ensure-python-dependencies.sh

      - name: Install acceptance browser
        run: .venv/bin/python -m playwright install --with-deps chromium

      - name: Gate the receipts shipped by this change
        uses: ./actions/verify
        with:
          changed-since: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          allow-commands: "true"
          require-tracked: "true"
          python-path: .venv/bin/python
