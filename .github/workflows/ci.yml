name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. A superseded push should not hold a runner while the
# commit it tested is already history.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          clean: false
          persist-credentials: false

      - name: Reset workspace and keep the Python environment
        run: git clean -ffdx -e /.venv/

      # Wheels and the Chromium build are the same on every run until
      # pyproject.toml or requirements-ui.txt changes, so they come from the
      # cache. On 2026-10-05 the browser install took 25 to 29 seconds and the
      # dependency install 10 to 11 seconds of each three-minute job.
      - name: Restore pip wheels and the acceptance browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'requirements-ui.txt') }}

      - name: Install dependencies when inputs changed
        run: bash scripts/ci/ensure-python-dependencies.sh

      - name: Run the full behavioral suite through the genesis receipt
        env:
          SHOWWORK_COMMAND_TIMEOUT_SECONDS: "600"
        run: .venv/bin/python scripts/check_ci_genesis.py

      - name: Install Chromium for receipt UI verification
        run: .venv/bin/python -m playwright install --with-deps chromium

      - name: Exercise receipt UI and responsive states
        run: .venv/bin/python scripts/check_receipts_ui.py

      - name: Verify today's claims
        run: .venv/bin/showwork verify

  conformance-js:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: JS auditor must match the frozen chain fixtures
        run: node js/showwork-audit/test.mjs

  receipts:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          # Receipts describe the branch, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Wheels and the Chromium build are the same on every run until
      # pyproject.toml or requirements-ui.txt changes, so they come from the
      # cache. On 2026-10-05 the browser install took 25 to 29 seconds and the
      # dependency install 10 to 11 seconds of each three-minute job.
      - name: Restore pip wheels and the acceptance browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'requirements-ui.txt') }}

      - name: Install acceptance test dependencies
        run: bash scripts/ci/ensure-python-dependencies.sh

      - name: Install acceptance browser
        run: .venv/bin/python -m playwright install --with-deps chromium

      - name: Review the receipts shipped by this change
        uses: ./actions/verify
        env:
          SHOWWORK_COMMAND_TIMEOUT_SECONDS: "600"
        with:
          mode: advisory
          changed-since: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          allow-commands: "true"
          require-tracked: "true"
          python-path: .venv/bin/python
