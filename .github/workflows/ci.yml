name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, pc]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          clean: false

      - name: Reset workspace and keep the Python environment
        run: git clean -ffdx -e /.venv/

      - name: Acquire the machine build slot
        id: heavy-slot
        shell: bash
        run: |
          token="$(/home/patri/actions-runners/bin/ci-heavy-slot acquire)"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Install dependencies when inputs changed
        run: bash scripts/ci/ensure-python-dependencies.sh

      - name: Run behavioral and conformance tests
        run: .venv/bin/python scripts/run_tests.py

      - name: Verify the committed genesis receipt
        run: .venv/bin/showwork verify --session genesis --no-report

      - name: Release the machine build slot
        if: ${{ always() && steps.heavy-slot.outputs.token != '' }}
        run: /home/patri/actions-runners/bin/ci-heavy-slot release "${{ steps.heavy-slot.outputs.token }}"

  conformance-js:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, pc]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: JS auditor must match the frozen chain fixtures
        run: node js/showwork-audit/test.mjs

  receipts:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, pc]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Gate on the repo's own receipts (chain audit + phase-1 session)
        uses: ./actions/verify
        with:
          session: v02-phase-1
          # allow-commands stays false: this doubles as a live demonstration
          # of fork-safe mode - the suite's command claim reports the policy
          # error honestly and the gate tolerates YELLOW unless strict.
