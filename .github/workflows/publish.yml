name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: [self-hosted, linux, x64, pc]
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      # When PYPI_TOKEN is set on the repo, use token upload; otherwise OIDC trusted publisher.
      HAS_TOKEN: ${{ secrets.PYPI_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Reset workspace and keep the Python environment
        run: git clean -ffdx -e /.venv/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Acquire the machine build slot
        id: heavy-slot
        shell: bash
        run: |
          token="$(/home/patri/actions-runners/bin/ci-heavy-slot acquire)"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Install dependencies when inputs changed
        run: bash scripts/ci/ensure-python-dependencies.sh

      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -q

      - name: Build package
        run: .venv/bin/python -m build
        env:
          SOURCE_DATE_EPOCH: "315532800"

      - name: Publish to PyPI (trusted publishing)
        if: ${{ env.HAS_TOKEN != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Publish to PyPI (token fallback)
        if: ${{ env.HAS_TOKEN == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_TOKEN }}

      - name: Release the machine build slot
        if: ${{ always() && steps.heavy-slot.outputs.token != '' }}
        run: /home/patri/actions-runners/bin/ci-heavy-slot release "${{ steps.heavy-slot.outputs.token }}"
