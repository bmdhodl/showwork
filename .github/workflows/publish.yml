name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to publish after a runner failure"
        required: true
        type: string

permissions:
  contents: read

# Publishing runs on GitHub-hosted compute. Never interrupt an active upload.
concurrency:
  group: publish-to-pypi
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      # When PYPI_TOKEN is set on the repo, use token upload; otherwise OIDC trusted publisher.
      HAS_TOKEN: ${{ secrets.PYPI_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          clean: false
          fetch-depth: 0

      - name: Validate release tag provenance
        env:
          RELEASE_REF: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
        run: |
          # checkout may peel an annotated tag locally. Its commit is already
          # present; refreshing tags would reject that equivalent local ref.
          git fetch --no-tags origin main:refs/remotes/origin/main
          GITHUB_REF="$RELEASE_REF" python3 scripts/validate_release.py

      - name: Reset workspace and keep the Python environment
        run: git clean -ffdx -e /.venv/

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies when inputs changed
        run: bash scripts/ci/ensure-python-dependencies.sh

      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -q

      - name: Build package
        run: .venv/bin/python -m build
        env:
          SOURCE_DATE_EPOCH: "315532800"

      - name: Publish to PyPI (trusted publishing)
        if: ${{ env.HAS_TOKEN != 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

      - name: Publish to PyPI (token fallback)
        if: ${{ env.HAS_TOKEN == 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_TOKEN }}
