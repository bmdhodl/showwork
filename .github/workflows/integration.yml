name: Hourly installed-package integration

on:
  schedule:
    - cron: "19 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Re-execute this commit after triage, even if verified or retry-limited
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: hourly-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Reuse equivalent successful execution or admit a bounded retry
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: python scripts/select_hourly_integration.py

  integration:
    needs: admission
    if: needs.admission.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build and install the exact commit
        run: |
          python -m pip install build pytest 'setuptools>=77.0.3' wheel
          python -m build --wheel
          python -m pip install --no-deps dist/*.whl
      - name: Exercise installed CLI acceptance and refusal paths
        run: python scripts/smoke_release.py
      - name: Exercise outcome requirements and CLI behavior
        run: python -m pytest tests/test_outcomes.py tests/test_cli.py -q
      - name: Record actual execution identity
        if: always()
        run: |
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          python --version >> "$GITHUB_STEP_SUMMARY"
          python -m pip freeze >> "$GITHUB_STEP_SUMMARY"
