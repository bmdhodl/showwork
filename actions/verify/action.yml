name: "showwork verify"
description: "Rerun declared acceptance checks and require a complete committed outcome receipt."
branding:
  icon: check-circle
  color: green
inputs:
  root:
    description: "Project root containing .showwork"
    default: "."
  session:
    description: "One session to verify; mutually exclusive with changed-since"
    default: ""
  changed-since:
    description: "Git base revision; verify all receipts changed by this PR"
    default: ""
  require-tracked:
    description: "Require receipt files to match committed HEAD"
    default: "true"
  legacy-integrity-baseline:
    description: "Optional full Git commit ID acknowledging unchanged shared legacy files; their audit remains RED"
    default: ""
  python-path:
    description: "Prepared Python interpreter with the project's test dependencies; empty uses an isolated venv"
    default: ""
  strict:
    description: "Deprecated: outcome gates always reject incomplete verification"
    default: "true"
  allow-commands:
    description: "Execute repository Python checks only in a trusted context"
    default: "false"
  allow-network:
    description: "Permit HTTP checks only in a trusted context"
    default: "false"
runs:
  using: composite
  steps:
    - name: Install the verifier from this action's exact ref
      shell: bash
      env:
        SW_PYTHON: ${{ inputs.python-path }}
      run: |
        if [ -n "$SW_PYTHON" ]; then
          PY="$SW_PYTHON"
        else
          python -m venv "${RUNNER_TEMP}/showwork-action-venv"
          PY="${RUNNER_TEMP}/showwork-action-venv/bin/python"
        fi
        "$PY" -m pip install --quiet "${GITHUB_ACTION_PATH}/../.."
        "$PY" -I -m showwork doctor
        echo "SHOWWORK_ACTION_PY=$PY" >> "$GITHUB_ENV"
    - name: Verify the outcome receipt
      shell: bash
      env:
        SW_ROOT: ${{ inputs.root }}
        SW_SESSION: ${{ inputs.session }}
        SW_BASE: ${{ inputs.changed-since }}
        SW_TRACKED: ${{ inputs.require-tracked }}
        SW_LEGACY_BASELINE: ${{ inputs.legacy-integrity-baseline }}
        SW_ALLOW_COMMANDS: ${{ inputs.allow-commands }}
        SW_ALLOW_NETWORK: ${{ inputs.allow-network }}
      run: |
        set -euo pipefail
        if [ "$SW_ALLOW_COMMANDS" != "true" ]; then export SHOWWORK_NO_COMMANDS=1; fi
        if [ "$SW_ALLOW_NETWORK" != "true" ]; then export SHOWWORK_NO_NETWORK=1; fi
        args=(--root "$SW_ROOT" gate)
        if [ -n "$SW_SESSION" ] && [ -z "$SW_BASE" ]; then
          args+=(--session "$SW_SESSION")
        elif [ -n "$SW_BASE" ] && [ -z "$SW_SESSION" ]; then
          args+=(--changed-since "$SW_BASE")
        else
          echo "Supply exactly one of session or changed-since." >&2
          exit 2
        fi
        if [ "$SW_TRACKED" = "true" ]; then args+=(--require-tracked); fi
        if [ -n "$SW_LEGACY_BASELINE" ]; then args+=(--legacy-integrity-baseline "$SW_LEGACY_BASELINE"); fi
        echo '## showwork declared acceptance checks' >> "$GITHUB_STEP_SUMMARY"
        set +e
        output=$("$SHOWWORK_ACTION_PY" -I -m showwork "${args[@]}" 2>&1)
        code=$?
        set -e
        printf '%s\n' "$output"
        printf '```text\n%s\n```\n' "$output" >> "$GITHUB_STEP_SUMMARY"
        exit "$code"
